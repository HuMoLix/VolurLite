user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    keepalive_timeout  65;
    client_max_body_size 1024M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    types_hash_max_size 2048;

    # 多拓扑自适应客户端真实 IP 解析:
    # 1. 优先提取 CDN/WAF 专用真实头 (Cloudflare CF-Connecting-IP, True-Client-IP)
    # 2. 其次继承上游反代/FRP 隧道透传的 X-Real-IP
    # 3. 最后在直连开箱即用模式下自动采用直连 $remote_addr
    map $http_cf_connecting_ip $cdn_real_ip {
        default $http_cf_connecting_ip;
        ""      $http_true_client_ip;
    }

    map $cdn_real_ip $upstream_or_cdn_ip {
        default $cdn_real_ip;
        ""      $http_x_real_ip;
    }

    map $upstream_or_cdn_ip $client_real_ip {
        default $upstream_or_cdn_ip;
        ""      $remote_addr;
    }

    # 多拓扑自适应 TLS 握手特征继承:
    # 1. 若上游宿主机反向代理已完成 HTTPS 终结并透传了 X-TLS-*，则继承上游特征
    # 2. 若由当前 Nginx 直接终结 HTTPS，则读取本地 $ssl_* 内建变量
    map $http_x_tls_protocol $effective_tls_protocol {
        default $http_x_tls_protocol;
        ""      $ssl_protocol;
    }
    map $http_x_tls_cipher $effective_tls_cipher {
        default $http_x_tls_cipher;
        ""      $ssl_cipher;
    }
    map $http_x_tls_ciphers $effective_tls_ciphers {
        default $http_x_tls_ciphers;
        ""      $ssl_ciphers;
    }
    map $http_x_tls_curves $effective_tls_curves {
        default $http_x_tls_curves;
        ""      $ssl_curves;
    }
    map $http_x_tls_alpn $effective_tls_alpn {
        default $http_x_tls_alpn;
        ""      $ssl_alpn_protocol;
    }
    map $http_x_tls_session_reused $effective_tls_session_reused {
        default $http_x_tls_session_reused;
        ""      $ssl_session_reused;
    }

    # 基于客户端真实 IP 的连接并发与请求速率限制 (第一道前置防御控制)
    limit_conn_zone $client_real_ip zone=volur_conn_limit:10m;
    limit_req_zone $client_real_ip zone=volur_api_req_limit:10m rate=30r/s;
    limit_req_zone $client_real_ip zone=volur_auth_req_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_status 429;

    server {

        listen 80;
        listen [::]:80;
        server_name localhost;

        root /usr/share/nginx/html;

        limit_conn volur_conn_limit 50;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /api/v1/realtime/stream {
            proxy_pass http://volur-app:8080/api/v1/realtime/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 针对敏感认证、验证码与发信接口专项严格高频防御 (5次/秒，突发容忍10次，超额直接429)
        location ^~ /api/v1/auth/login {
            limit_req zone=volur_auth_req_limit burst=10 nodelay;
            limit_conn volur_conn_limit 15;

            proxy_pass http://volur-app:8080/api/v1/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 原生纯 Nginx 零编译开箱方案：自适应透传/继承 TLS 协商特征
            proxy_set_header X-TLS-Protocol $effective_tls_protocol;
            proxy_set_header X-TLS-Cipher $effective_tls_cipher;
            proxy_set_header X-TLS-Ciphers $effective_tls_ciphers;
            proxy_set_header X-TLS-Curves $effective_tls_curves;
            proxy_set_header X-TLS-ALPN $effective_tls_alpn;
            proxy_set_header X-TLS-Session-Reused $effective_tls_session_reused;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/auth/register {
            limit_req zone=volur_auth_req_limit burst=10 nodelay;
            limit_conn volur_conn_limit 15;

            proxy_pass http://volur-app:8080/api/v1/auth/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 原生纯 Nginx 零编译开箱方案：自适应透传/继承 TLS 协商特征
            proxy_set_header X-TLS-Protocol $effective_tls_protocol;
            proxy_set_header X-TLS-Cipher $effective_tls_cipher;
            proxy_set_header X-TLS-Ciphers $effective_tls_ciphers;
            proxy_set_header X-TLS-Curves $effective_tls_curves;
            proxy_set_header X-TLS-ALPN $effective_tls_alpn;
            proxy_set_header X-TLS-Session-Reused $effective_tls_session_reused;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/email/captcha {
            limit_req zone=volur_auth_req_limit burst=10 nodelay;
            limit_conn volur_conn_limit 15;

            proxy_pass http://volur-app:8080/api/v1/email/captcha;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 原生纯 Nginx 零编译开箱方案：自适应透传/继承 TLS 协商特征
            proxy_set_header X-TLS-Protocol $effective_tls_protocol;
            proxy_set_header X-TLS-Cipher $effective_tls_cipher;
            proxy_set_header X-TLS-Ciphers $effective_tls_ciphers;
            proxy_set_header X-TLS-Curves $effective_tls_curves;
            proxy_set_header X-TLS-ALPN $effective_tls_alpn;
            proxy_set_header X-TLS-Session-Reused $effective_tls_session_reused;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/v1/captcha {
            limit_req zone=volur_auth_req_limit burst=15 nodelay;
            limit_conn volur_conn_limit 20;

            proxy_pass http://volur-app:8080/api/v1/captcha;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 原生纯 Nginx 零编译开箱方案：自适应透传/继承 TLS 协商特征
            proxy_set_header X-TLS-Protocol $effective_tls_protocol;
            proxy_set_header X-TLS-Cipher $effective_tls_cipher;
            proxy_set_header X-TLS-Ciphers $effective_tls_ciphers;
            proxy_set_header X-TLS-Curves $effective_tls_curves;
            proxy_set_header X-TLS-ALPN $effective_tls_alpn;
            proxy_set_header X-TLS-Session-Reused $effective_tls_session_reused;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/ {
            limit_req zone=volur_api_req_limit burst=50 nodelay;
            limit_conn volur_conn_limit 50;

            proxy_pass http://volur-app:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 原生纯 Nginx 零编译开箱方案：自适应透传/继承 TLS 协商特征
            proxy_set_header X-TLS-Protocol $effective_tls_protocol;
            proxy_set_header X-TLS-Cipher $effective_tls_cipher;
            proxy_set_header X-TLS-Ciphers $effective_tls_ciphers;
            proxy_set_header X-TLS-Curves $effective_tls_curves;
            proxy_set_header X-TLS-ALPN $effective_tls_alpn;
            proxy_set_header X-TLS-Session-Reused $effective_tls_session_reused;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
        }
    }
}