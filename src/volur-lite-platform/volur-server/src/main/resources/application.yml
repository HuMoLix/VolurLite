server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: volur-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
    encoding:
      enabled: true
      force: true
      charset: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  show-actuator: false

# Volur Custom Business Configurations
volur:
  jwt:
    secret: "${VOLUR_JWT_SECRET:VolurLitePlatformSecretKeyForJwtAuthentication2026SecureString!}"
    expire-seconds: ${VOLUR_JWT_EXPIRE_SECONDS:86400} # 24 hours
    refresh-expiration-ms: ${VOLUR_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    remember-me-refresh-expiration-ms: ${VOLUR_JWT_REMEMBER_ME_REFRESH_EXPIRATION_MS:2592000000} # 30 days
    header: "Authorization"
    token-prefix: "Bearer "
  container:
    docker-host: "${VOLUR_CONTAINER_DOCKER_HOST:tcp://localhost:2375}" # Or unix:///var/run/docker.sock for Linux
    default-timeout-minutes: 60
    max-instances-per-user: 1
    network-name: "volur-challenge-net"
  k3s:
    namespace: "${VOLUR_K3S_NAMESPACE:volur-challenges}"
    public-host: "${VOLUR_K3S_PUBLIC_HOST:127.0.0.1}"
    kubeconfig-path: "${VOLUR_K3S_KUBECONFIG_PATH:/etc/rancher/k3s/k3s.yaml}"
    master-url: "${VOLUR_K3S_MASTER_URL:https://127.0.0.1:6443}"
  captcha:
    puzzle:
      custom-path: "${VOLUR_CAPTCHA_PUZZLE_CUSTOM_PATH:}" # Optional external custom background images directory

