server:
  port: ${SERVER_PORT:8080}
  tomcat:
    accept-count: 200
    max-connections: 10000

spring:
  application:
    name: volur-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
    encoding:
      enabled: true
      force: true
      charset: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# Actuator Configuration (Health & Info only, high-risk endpoints strictly disabled across all profiles)
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info
        exclude: heapdump,env,threaddump,beans,mappings,configprops,shutdown
  endpoint:
    health:
      enabled: true
      show-details: always
    info:
      enabled: true
    heapdump:
      enabled: false
    env:
      enabled: false
    threaddump:
      enabled: false
    beans:
      enabled: false
    mappings:
      enabled: false
    configprops:
      enabled: false
    shutdown:
      enabled: false

volur:
  jwt:
    secret: "${VOLUR_JWT_SECRET:VolurLitePlatformSecretKeyForJwtAuthentication2026SecureString!}"
    expire-seconds: ${VOLUR_JWT_EXPIRE_SECONDS:86400} # 24 hours
    refresh-expiration-ms: ${VOLUR_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    remember-me-refresh-expiration-ms: ${VOLUR_JWT_REMEMBER_ME_REFRESH_EXPIRATION_MS:2592000000} # 30 days
    header: "Authorization"
    token-prefix: "Bearer "
  security:
    webauthn:
      enabled: ${VOLUR_WEBAUTHN_ENABLED:true}
      rp-id: "${VOLUR_WEBAUTHN_RP_ID:localhost}"
      rp-name: "${VOLUR_WEBAUTHN_RP_NAME:Volur Lite}"
      timeout: ${VOLUR_WEBAUTHN_TIMEOUT:60s}
      user-verification: "${VOLUR_WEBAUTHN_USER_VERIFICATION:preferred}"
      resident-key: "${VOLUR_WEBAUTHN_RESIDENT_KEY:preferred}"
      attestation: "${VOLUR_WEBAUTHN_ATTESTATION:none}"
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:8080"
        - "http://127.0.0.1:5173"
        - "http://127.0.0.1:8080"
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:3001"
        - "http://localhost:4173"
        - "https://localhost:5173"
        - "https://localhost:8080"
        - "https://localhost:3001"
  container:
    docker-host: "${VOLUR_CONTAINER_DOCKER_HOST:tcp://localhost:2375}" # Or unix:///var/run/docker.sock for Linux
    default-timeout-minutes: 60
    max-instances-per-user: 1
    network-name: "volur-challenge-net"
  k3s:
    namespace: "${VOLUR_K3S_NAMESPACE:volur-challenges}"
    public-host: "${VOLUR_K3S_PUBLIC_HOST:127.0.0.1}"
    kubeconfig-path: "${VOLUR_K3S_KUBECONFIG_PATH:/etc/rancher/k3s/k3s.yaml}"
    master-url: "${VOLUR_K3S_MASTER_URL:https://127.0.0.1:6443}"
  captcha:
    puzzle:
      custom-path: "${VOLUR_CAPTCHA_PUZZLE_CUSTOM_PATH:}" # Optional external custom background images directory
    crypto:
      rsa-private-key: "${VOLUR_CAPTCHA_RSA_PRIVATE_KEY:}"
      rsa-public-key: "${VOLUR_CAPTCHA_RSA_PUBLIC_KEY:}"
      anti-replay-window-ms: ${VOLUR_CAPTCHA_ANTI_REPLAY_WINDOW_MS:120000}
  cache:
    enabled: ${VOLUR_CACHE_ENABLED:true}
    invalidation:
      enabled: true
      topic: "${VOLUR_CACHE_TOPIC:vredis:topic:cache:evict}"
    l2:
      key-prefix: "${VOLUR_CACHE_KEY_PREFIX:vcache:}"

