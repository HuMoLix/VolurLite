spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${VOLUR_MYSQL_HOST:volur-mysql}:3306/volur_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    username: ${VOLUR_MYSQL_USER:root}
    password: ${VOLUR_MYSQL_PASSWORD:volur_mysql_secret_2026}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 60
      idle-timeout: 30000
      pool-name: VolurHikariCP-Prod
      max-lifetime: 1800000
      connection-timeout: 10000
      validation-timeout: 3000

  data:
    redis:
      host: ${VOLUR_REDIS_HOST:volur-redis}
      port: 6379
      password: ${VOLUR_REDIS_PASSWORD:}
      database: ${VOLUR_REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 3000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  mongodb:
    uri: mongodb://${VOLUR_MONGO_HOST:localhost}:27017/volur_db

logging:
  level:
    root: INFO
    com.humolix.volur: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN